version: "1"

policies:
  # One rule per question from the workshop spine.
  - name: no-critical-cves
    type: vulnerability
    severity: critical
    action: fail

  - name: require-sbom
    type: attestation
    attestation: sbom
    action: fail

  - name: require-provenance
    type: attestation
    attestation: slsa-provenance
    action: fail
